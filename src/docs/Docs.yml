openapi: 3.0.1
info:
  title: User and Blog Management API
  description: API documentation for user registration, login, profile management, and blog creation.
  version: 1.0.0
  contact:
    name: Developer Team
    email: devteam@example.com

servers:
  - url: http://localhost:3000/api
    description: Local server

paths:
  # Authentication Routes
  /auth/register:
    post:
      summary: Register a new user
      description: Create a new user with name, email, password, and other details.
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                password:
                  type: string
                  example: "password123"
                role:
                  type: string
                  enum:
                    - user
                    - admin
                  default: "user"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User registered successfully."
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "609b4dba9f1d8e001f8b4567"
                      name:
                        type: string
                        example: "John Doe"
                      email:
                        type: string
                        example: "john.doe@example.com"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email already in use."
                  error:
                    type: string
                    example: "Bad Request"

  /auth/login:
    post:
      summary: Login a user
      description: Authenticate an existing user with email and password.
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login successful"
                  token:
                    type: string
                    example: "jwt-token-here"
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid email or password."
                  error:
                    type: string
                    example: "Bad Request"

  /auth/logout:
    post:
      summary: Logout a user
      description: Log out the current authenticated user.
      operationId: logoutUser
      tags:
        - Auth
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized"
                  error:
                    type: string
                    example: "Unauthorized"

  /auth/delete/{userId}:
    delete:
      summary: Delete user by ID
      description: Delete a user by their user ID.
      operationId: deleteUser
      tags:
        - Auth
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: The ID of the user to delete
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User deleted successfully."
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User not found."
                  error:
                    type: string
                    example: "Not Found"

  # User Routes
  /users/{id}:
    put:
      summary: Update user profile
      description: Update user information excluding email and password.
      operationId: updateUser
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the user to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "John Doe"
                role:
                  type: string
                  enum:
                    - user
                    - admin
                  default: "user"
                location:
                  type: string
                  example: "New York, USA"
                bio:
                  type: string
                  example: "Software Developer"
                avatar_url:
                  type: string
                  format: uri
                  example: "https://example.com/avatar.jpg"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User updated successfully."
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "John Doe"
                      role:
                        type: string
                        example: "user"
        '400':
          description: Invalid data or forbidden fields (e.g., email or password)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid request data."
                  error:
                    type: string
                    example: "Bad Request"

  /users/{username}:
    get:
      summary: Get user by username
      description: Retrieve a user by their username.
      operationId: getUserByUsername
      tags:
        - Users
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: The username of the user to fetch
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User fetched successfully."
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "John Doe"
                      email:
                        type: string
                        example: "john.doe@example.com"
                      role:
                        type: string
                        example: "user"
                      avatar_url:
                        type: string
                        format: uri
                        example: "https://example.com/avatar.jpg"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User not found."
                  error:
                    type: string
                    example: "Not Found"

  /admin/users/{name}:
    get:
      summary: Admin Get user by name
      description: Admins can retrieve a user by their name.
      operationId: getUserByAdmin
      tags:
        - Admin
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The name of the user to fetch
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User fetched successfully."
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "John Doe"
                      email:
                        type: string
                        example: "john.doe@example.com"
                      role:
                        type: string
                        example: "user"
                      avatar_url:
                        type: string
                        format: uri
                        example: "https://example.com/avatar.jpg"
        '403':
          description: Forbidden for non-admin users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Access denied. Admins only."
                  error:
                    type: string
                    example: "Forbidden"

  # Blog Routes
  /blogs:
    post:
      summary: Create a new blog post
      description: Create a new blog post by the authenticated user.
      operationId: createBlog
      tags:
        - Blogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "My First Blog Post"
                content:
                  type: string
                  example: "This is the content of my first blog post."
      responses:
        '201':
          description: Blog post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Blog post created successfully."
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "609b4dba9f1d8e001f8b4567"
                      title:
                        type: string
                        example: "My First Blog Post"
                      content:
                        type: string
                        example: "This is the content of my first blog post."

  /blogs/{blogId}:
    get:
      summary: Get blog post by ID
      description: Retrieve a blog post by its ID.
      operationId: getBlogById
      tags:
        - Blogs
      parameters:
        - in: path
          name: blogId
          required: true
          schema:
            type: string
          description: The ID of the blog post to fetch
      responses:
        '200':
          description: Blog post fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Blog post fetched successfully."
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "609b4dba9f1d8e001f8b4567"
                      title:
                        type: string
                        example: "My First Blog Post"
                      content:
                        type: string
                        example: "This is the content of my first blog post."
        '404':
          description: Blog post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Blog post not found."
                  error:
                    type: string
                    example: "Not Found"

  /blogs/{blogIdx}:
    delete:
      summary: Delete a blog post
      description: Delete a blog post by its ID.
      operationId: deleteBlog
      tags:
        - Blogs
      parameters:
        - in: path
          name: blogId
          required: true
          schema:
            type: string
          description: The ID of the blog post to delete
      responses:
        '200':
          description: Blog post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Blog post deleted successfully."
        '404':
          description: Blog post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Blog post not found."
                  error:
                    type: string
                    example: "Not Found"
