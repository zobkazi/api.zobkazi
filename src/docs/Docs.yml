openapi: 3.0.0
info:
  title: "API Documentation"
  description: "A simple API for demonstration purposes"
  version: "1.0.0"
servers:
  - url: "http://localhost:3000"
paths:
  /users:
    get:
      summary: "Get all users"
      description: "Returns a list of users"
      operationId: "getUsers"
      tags:
        - "api"
      responses:
        '200':
          description: "A list of users"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
        '400':
          description: "Bad request"
        '500':
          description: "Internal server error"
  /users/{id}:
    get:
      summary: "Get a user by ID"
      description: "Returns a single user based on ID"
      operationId: "getUserById"
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: "User ID"
      responses:
        '200':
          description: "A single user"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
        '404':
          description: "User not found"
